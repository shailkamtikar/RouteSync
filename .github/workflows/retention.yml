name: retention
# Daily data retention. Needs the DATABASE_URL repository secret (session pooler string).
on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ vars.RETENTION_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]" python-dotenv
      - run: python scripts/retention.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
