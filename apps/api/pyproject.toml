[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter wraps code; long message strings are allowed

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real external service; excluded from CI", "db: runs against the dev database; run locally with -m db"]
addopts = "-m \"not live and not db\""
